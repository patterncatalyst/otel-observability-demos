# Demo 04 — GC pauses as trace gaps
# Stack: otel-lgtm + Spring Boot service (GC switchable via JAVA_TOOL_OPTIONS env)

name: otel-demo-04

services:

  lgtm:
    image: docker.io/grafana/otel-lgtm:0.8.1
    container_name: demo04-lgtm
    ports:
      - "3004:3000"     # Grafana
      - "34317:4317"    # OTLP gRPC
      - "34318:4318"    # OTLP HTTP
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning/datasources:/otel-lgtm/grafana/conf/provisioning/datasources:Z
      - ./grafana/provisioning/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards:Z
    tmpfs:
      - /tmp
    user: "0"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  service:
    build:
      context: ./service
      dockerfile: Containerfile
    container_name: demo04-service
    ports:
      - "8084:8080"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://lgtm:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_SERVICE_NAME: "demo04-service"
      OTEL_RESOURCE_ATTRIBUTES: "service.namespace=otel-demos,deployment.environment=demo,service.version=1.0.0,gc.mode=${GC_MODE:-shenandoah}"
      # demo.sh templates these per-GC. Default = UBI9 default = Shenandoah, no flag.
      JAVA_TOOL_OPTIONS: >-
        -javaagent:/app/opentelemetry-javaagent.jar
        -XX:+UseContainerSupport
        -Xms256m -Xmx256m
        ${GC_FLAGS:-}
    depends_on:
      lgtm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
