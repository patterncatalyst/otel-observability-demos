spring:
  application:
    name: demo04-service
  threads:
    virtual:
      enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        # Critical for THIS demo: emit GC pause histograms for Prometheus
        jvm.gc.pause: true
        http.server.requests: true
      percentiles:
        jvm.gc.pause: 0.5, 0.95, 0.99
        http.server.requests: 0.5, 0.95, 0.99
  tracing:
    sampling:
      probability: 1.0
  prometheus:
    metrics:
      export:
        enabled: true

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:34318}
      protocol: ${OTEL_EXPORTER_OTLP_PROTOCOL:http/protobuf}
  service:
    name: ${OTEL_SERVICE_NAME:demo04-service}

logging:
  level:
    root: INFO
    com.example.gc: DEBUG
  pattern:
    correlation: "[%X{traceId:-},%X{spanId:-}]"
    console: >-
      %clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:-}){magenta}
      %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan}
      %clr(${spring.application.name:-}){yellow} %clr([%X{traceId:-},%X{spanId:-}]){blue}
      %clr(:){faint} %m%n%wEx
