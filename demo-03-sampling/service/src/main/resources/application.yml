spring:
  application:
    name: demo03-service
  threads:
    virtual:
      enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
  tracing:
    # Note: when the OTel agent is attached, OTEL_TRACES_SAMPLER env wins.
    # This block is fallback behavior if the agent is NOT attached.
    sampling:
      probability: 1.0
  prometheus:
    metrics:
      export:
        enabled: true

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:24318}
      protocol: ${OTEL_EXPORTER_OTLP_PROTOCOL:http/protobuf}
  service:
    name: ${OTEL_SERVICE_NAME:demo03-service}

logging:
  level:
    root: INFO
    com.example.sampling: DEBUG
  pattern:
    correlation: "[%X{trace_id:-},%X{span_id:-}]"
    console: >-
      %clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:-}){magenta}
      %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan}
      %clr(${spring.application.name:-}){yellow} %clr([%X{trace_id:-},%X{span_id:-}]){blue}
      %clr(:){faint} %m%n%wEx
