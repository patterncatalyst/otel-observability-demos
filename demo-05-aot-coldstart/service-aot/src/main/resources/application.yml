spring:
  # aot: # disabled to test SDK telemetry compatibility
    # enabled: true
  application:
    name: ${OTEL_SERVICE_NAME:demo05-service}
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:mem:widgets;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, startup
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
  tracing:
    sampling:
      probability: 1.0
  prometheus:
    metrics:
      export:
        enabled: true
otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:44318}
      protocol: ${OTEL_EXPORTER_OTLP_PROTOCOL:http/protobuf}
  service:
    name: ${OTEL_SERVICE_NAME:demo05-service}
logging:
  level:
    root: INFO
    com.example.coldstart: DEBUG
  pattern:
    correlation: "[%X{trace_id:-},%X{span_id:-}]"
    console: >-
      %clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:-}){magenta}
      %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan}
      %clr(${spring.application.name:-}){yellow} %clr([%X{trace_id:-},%X{span_id:-}]){blue}
      %clr(:){faint} %m%n%wEx
